# Gradle 自身设置（MC 版本相关参数在 matrix.properties 里）
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
# 没有对应 JDK 时允许 Gradle 自动下载工具链（1.20.5+ 需要 Java 21）
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# =============================================================================
#  代理设置（统一走 127.0.0.1:10808）
#
#  这些 systemProp 会注入 Gradle 的 JVM，因此以下下载全部走代理：
#    * Gradle 依赖解析（Forge / NeoForge / Fabric / Loom 的 Maven 仓库）
#    * Fabric Loom 拉取 Minecraft 本体、Mojang 映射、资源文件
#    * ForgeGradle 的 MCP / 反编译步骤
#    * Minecraft 官方映射与库文件
#
#  改端口：同时改本文件的 4 行 proxyPort，以及 build.bat 顶部的
#  PROXY_PORT 变量（后者只用于下载 Gradle 分发包本身）。
#
#  如果你的 10808 是 SOCKS5 而不是 HTTP，把这 4 行 systemProp.*.proxyHost /
#  proxyPort 换成：
#      systemProp.socksProxyHost=127.0.0.1
#      systemProp.socksProxyPort=10808
# =============================================================================
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10808
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10808
# 本地地址不走代理，避免 Gradle / Loom 的本地通信被拦截
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]
systemProp.https.nonProxyHosts=localhost|127.0.0.1|[::1]
