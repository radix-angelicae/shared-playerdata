// =============================================================================
//  统一的代理控制（Gradle init script，由 build.bat / build.sh 用 -I 传入）
//
//  gradle.properties 里的 systemProp.http(s).proxy* 在 Gradle JVM 启动时就已生效，
//  所以命令行 --no-proxy 只清掉「下载 Gradle 分发包」用的 SPD_PROXY 是不够的：
//  gradle.properties 那 4 行仍然会把所有依赖下载送到 127.0.0.1:10808。
//  这就是之前 --no-proxy 名不副实、代理没开时依旧 Connection refused 的原因。
//
//  本脚本按 -Dspd.proxyMode 调整运行时的 JVM 系统属性：
//    * 不带参数 / 默认    保持 gradle.properties 的配置不动
//    * -Dspd.proxyMode=off 清空全部代理属性（真正的 --no-proxy）
//    * -Dspd.proxyHost=.. / -Dspd.proxyPort=..  覆盖主机 / 端口，
//      不用手改 gradle.properties 就能换端口试
//
//  Gradle 7.5.1（1.19.2 用）和 8.x 都支持 settingsEvaluated / beforeProject。
// =============================================================================

def mode = System.getProperty('spd.proxyMode', '')

def clearAll = {
    ['http', 'https'].each { scheme ->
        ['proxyHost', 'proxyPort', 'nonProxyHosts'].each { key ->
            System.clearProperty("${scheme}.${key}")
        }
    }
    ['socksProxyHost', 'socksProxyPort', 'socksNonProxyHosts'].each { key ->
        System.clearProperty(key)
    }
}

if (mode == 'off') {
    clearAll()
    // JDK 的 ProxySelector.getDefault() 是懒加载并缓存的。如果 Gradle 在本
    // init script 之前已经取过一次，缓存下来的仍是「带代理」的 selector，
    // 光清系统属性不够。置 null 会强制 getDefault() 重新构造一个，
    // 那时读到的就是已清空的代理属性 -> 真正直连。
    try {
        System.setProperty('java.net.useSystemProxies', 'false')
        java.net.ProxySelector.setDefault(null)
    } catch (Throwable ignored) {
        // 个别 JVM 限制该调用时，clearAll() 仍然生效
    }
} else {
    def h = System.getProperty('spd.proxyHost')
    def p = System.getProperty('spd.proxyPort')
    if (h) {
        System.setProperty('http.proxyHost', h)
        System.setProperty('https.proxyHost', h)
    }
    if (p) {
        System.setProperty('http.proxyPort', p)
        System.setProperty('https.proxyPort', p)
    }
}

// 有些插件（Loom / ForgeGradle）会在 settings / project 配置阶段读取代理属性，
// 在这两个节点再清一次，确保 off 模式彻底生效。
if (mode == 'off') {
    try {
        gradle.settingsEvaluated { clearAll() }
        gradle.beforeProject { clearAll() }
    } catch (Throwable ignored) {
        // 老版本 Gradle 缺某个钩子时，顶层的 clearAll() 已经生效
    }
}
