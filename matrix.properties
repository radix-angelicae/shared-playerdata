# =============================================================================
#  Shared Player Data —— 版本矩阵（整个工程唯一的版本号来源）
#  build.bat / Gradle 都从这里读取。
#
#  想增删目标版本或加载器：改 mc.versions 和对应的 <版本>.loaders 即可。
#  想切换某个版本使用的 Gradle：加一行 <mc>.gradle=8.14 或 <mc>.<loader>.gradle=9.2
#
#  Gradle 与工具链的兼容性（重要，改之前先看这里）：
#    * ForgeGradle 6 依赖 Gradle 内部 API，官方明说每个 FG 版本只保证支持一个 Gradle 大版本。
#      实测 FG 6.0.30 在 Gradle 8.10 上会报
#      "Could not create an instance of type ... DefaultToolchainSpec"，
#      所以 Forge 组合统一降到 Gradle 8.8。若仍失败，再试 8.4。
#    * Loom 1.14+（1.21.11 的 Fabric）要求 Gradle 9.2+。
#    * ForgeGradle 5（1.19.2）只支持 Gradle 7。
#  想更新 Forge / NeoForge / Loom 版本号：运行
#      build.bat --update-versions
# =============================================================================

mod.version=1.0.0

# 各组合使用的 Gradle 版本。查找顺序：
#     <mc>.<loader>.gradle   ->   <mc>.gradle   ->   default.gradle
# 例如只想让 1.20.1 的 fabric 用 Gradle 9.2：加一行  1.20.1.fabric.gradle=9.2
# 不写就用这里的 default.gradle
default.gradle=8.10

# 不带 -PmcVersion 单独构建某个子项目时使用的默认 MC 版本
default.mcVersion=1.20.1

# 需要构建的全部 MC 版本（空格分隔）
mc.versions=1.19.2 1.19.4 1.20.1 1.20.4 1.20.6 1.21.1 1.21.5 1.21.11

# -----------------------------------------------------------------------------
#  1.19.x  —— 仅 Forge（1.19 时代还没有 NeoForge）
# -----------------------------------------------------------------------------
# ForgeGradle 5 只支持 Gradle 7（Forge 1.19.2 MDK 用的就是 7.5.1），
# 所以 1.19.2 单独指定 Gradle 7.5.1，构建脚本会自动下载一份。
1.19.2.loaders=forge
# pack.mcmeta 的 pack_format：只为消除 "Missing metadata in pack" 警告，
# 本模组不带任何资源，值不影响功能。填偏小只会在资源包界面显示
# 「为旧版本制作」，仍然可用；填偏大才会被判定为不兼容。
# 1.21.11 的值未经实机核对，若 MC 提示版本不符，按提示的数字改这里即可。
1.19.2.packFormat=9
1.19.2.java=17
1.19.2.gradle=7.5.1
1.19.2.forge=43.3.9
1.19.2.forgeGradle=5.1.83
1.19.2.forgeLoaderRange=[43,)

# 1.19.4 的 Forge MDK 已官方迁移到 ForgeGradle 6 + Gradle 8
1.19.4.loaders=forge
1.19.4.packFormat=13
1.19.4.java=17
1.19.4.forge=45.3.0
1.19.4.forge.gradle=8.8
1.19.4.forgeGradle=6.0.24
1.19.4.forgeLoaderRange=[45,)

