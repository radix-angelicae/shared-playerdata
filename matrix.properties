# 注意：1.21.11 的 Fabric 需要 Loom 1.14，而 Loom 1.14 要求 Gradle 9.2+；
# 同一个 MC 版本下的 Forge / NeoForge 又需要 Gradle 8.x，两者无法共用同一套 Gradle，
# 所以默认不带 fabric。确实需要时手动改这几行（然后单独构建这一个组合）：
#     1.21.11.loaders=fabric forge neoforge
#     1.21.11.loom=1.14.0
#     1.21.11.fabric.gradle=9.2
#     build.bat 1.21.11 fabric
1.21.11.loaders=forge neoforge
1.21.11.packFormat=55
1.21.11.java=21
1.21.11.fabricLoader=0.16.10
1.21.11.loom=1.8.12
# Forge 对最新 MC 的支持通常滞后。若 1.21.11 的 forge 构建失败，
# 把这行的 forge 去掉，只留 neoforge，或者运行 update_versions 校正版本号。
1.21.11.forge=61.0.0
1.21.11.forge.gradle=8.8
1.21.11.forgeGradle=6.0.30
1.21.11.forgeLoaderRange=[61,)
1.21.11.neoforge=21.11.45
1.21.11.neoGradle=7.0.145
